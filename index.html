<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchParty</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <canvas id="experience-canvas"></canvas>

    <section id="landing-screen" aria-label="Join a watch party">
        <form class="landing-content" id="join-form">
            <div class="ticket-main">
                <p class="eyebrow">Private theatre room</p>
                <h1>WATCH PARTY</h1>
                <p class="ticket-note">Admit one movie crew</p>
            </div>

            <div class="ticket-stub">
                <p class="stub-label">Entry Pass</p>

                <label class="field">
                    <span>Your name</span>
                    <input
                        id="display-name-input"
                        maxlength="24"
                        placeholder="Movie buddy"
                        autocomplete="nickname"
                    >
                </label>

                <label class="field">
                    <span>Room key</span>
                    <input
                        id="room-code-input"
                        maxlength="12"
                        placeholder="Leave empty to create"
                        autocomplete="off"
                    >
                </label>

                <button id="enter-theatre" type="button">
                    Enter Theatre
                </button>
            </div>
        </form>
    </section>

    <main id="app" aria-label="Watch party controls">
        <header id="room-hud">
            <div>
                <span class="label">Room</span>
                <strong id="room-code-display">----</strong>
            </div>
            <div>
                <span class="label">Guest</span>
                <strong id="guest-name-display">Guest</strong>
            </div>
            <button id="copy-room-btn" type="button">Copy Key</button>
        </header>
        <section id="panel-controls" aria-label="Panel controls">
            <button
                id="toggle-chat-btn"
                class="panel-toggle"
                type="button"
                data-panel-target="chat-panel"
                data-panel-name="chat"
                aria-controls="chat-panel"
                aria-expanded="true"
                aria-label="Hide chat"
                title="Hide chat"
            >
                <svg class="panel-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
                </svg>
                <span class="panel-toggle-slash" aria-hidden="true"></span>
            </button>

            <button
                id="toggle-reactions-btn"
                class="panel-toggle"
                type="button"
                data-panel-target="emote-bar"
                data-panel-name="reactions"
                aria-controls="emote-bar"
                aria-expanded="true"
                aria-label="Hide reactions"
                title="Hide reactions"
            >
                <svg class="panel-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" />
                </svg>
                <span class="panel-toggle-slash" aria-hidden="true"></span>
            </button>
        </section>
        <section id="screen-controls" aria-label="Screen controls">
            <button id="share-screen-btn" type="button">Share Screen</button>
            <button id="stop-share-btn" class="hidden" type="button">Stop Share</button>
        </section>

        <section id="emote-bar" aria-label="Reactions">
            <button type="button" data-emote="TOMATO" data-symbol="🍅">
                <span class="reaction-button-icon" aria-hidden="true">🍅</span>
                <span class="reaction-button-label"></span>
            </button>
            <button type="button" data-emote="LOL" data-symbol="😂">
                <span class="reaction-button-icon" aria-hidden="true">😂</span>
                <span class="reaction-button-label"></span>
            </button>
            <button type="button" data-emote="WOW" data-symbol="😮">
                <span class="reaction-button-icon" aria-hidden="true">😮</span>
                <span class="reaction-button-label"></span>
            </button>
            <button type="button" data-emote="CLAP" data-symbol="👏">
                <span class="reaction-button-icon" aria-hidden="true">👏</span>
                <span class="reaction-button-label"></span>
            </button>
        </section>

        <aside id="chat-panel" aria-label="Room chat">
            <div id="chat-messages" aria-live="polite"></div>
            <form id="chat-form">
                <input
                    id="chat-input"
                    maxlength="160"
                    placeholder="React to the scene..."
                    autocomplete="off"
                >
                <button type="submit">Send</button>
            </form>
        </aside>

        <div id="reaction-layer" aria-hidden="true"></div>

        <div id="seat-prompt" class="hidden">
            Click to sit
        </div>

        <section id="seat-actions" class="hidden" aria-label="Seat controls">
            <button id="focus-screen-btn" type="button">
                Focus Screen
            </button>
            <button id="stand-up-btn" type="button">
                Stand Up
            </button>
        </section>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
